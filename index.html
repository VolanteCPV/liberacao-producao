<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liberação de Produção</title>
<link rel="icon" type="image/png" href="ícone.png">
<link rel="apple-touch-icon" href="ícone.png">
<style>
body{font-family:Arial,sans-serif;background:#0b0f14;margin:0;padding:16px;color:#f8fafc}.card{max-width:520px;margin:auto;background:#151b23;padding:20px;border-radius:16px;border:1px solid #263241}h1{font-size:24px;margin:0 0 5px}.sub{color:#a8b3c2;margin-bottom:16px}.status{padding:11px;border-radius:9px;background:#0f141b;border:1px solid #334155;margin:12px 0;font-size:14px}label{font-weight:700;display:block;margin-top:12px}input,select{width:100%;box-sizing:border-box;padding:13px;margin-top:5px;border:1px solid #3b4758;border-radius:9px;font-size:17px;background:#0f141b;color:#f8fafc}button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:10px;color:#fff;font-size:16px;font-weight:700;background:#2563eb}.green{background:#15803d}.gray{background:#475569}.orange{background:#c2410c}button:disabled{opacity:.45}#resultado{display:none;margin-top:20px;text-align:center;border-top:1px solid #334155;padding-top:18px}#preview{width:100%;max-width:384px;background:#fff;border-radius:6px;image-rendering:auto}.small{font-size:12px;color:#94a3b8;margin-top:10px;word-break:break-all}
</style></head><body><div class="card">
<h1>Liberação de Produção</h1><div class="sub">NIIMBOT B1 • 50 × 30 mm • versão final otimizada</div>
<button class="green" type="button" onclick="conectarB1()">CONECTAR B1</button><div class="status" id="status">B1 ainda não conectada.</div>
<form onsubmit="gerar(event)"><label>Item</label><input id="item" inputmode="numeric" required placeholder="Ex.: 869"><label>OP</label><input id="op" inputmode="numeric" required placeholder="Ex.: 577110"><label>Linha</label><select id="linha" required onchange="atualizarMaquinas()"><option value="">Selecione a linha</option><option>Linha 1</option><option>Linha 2</option><option>Linha 3</option><option>Linha 4</option><option>Linha 5</option><option>LSR</option></select><label>Máquina</label><select id="maquina" required disabled><option value="">Primeiro selecione a linha</option></select><label>Setor</label><select id="setor" required><option value="">Selecione o setor</option><option>Vulcanização</option><option>Inspeção</option><option>LSR</option><option>Corte</option></select><button type="submit">GERAR ETIQUETA + QR</button><button class="gray" type="button" onclick="novoQR()">LIMPAR / NOVA ETIQUETA</button></form>
<div id="resultado"><canvas id="preview" width="384" height="240"></canvas><button class="orange" id="btnPrint" type="button" onclick="imprimirB1()">IMPRIMIR NA B1</button><div class="small" id="linktxt"></div></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/niimbot-web-bluetooth@2.4.0/src/niimbot.js"></script>
<script>
const MAQUINAS={"Linha 1":["168","186","234","235","495","494","202","203","491","197","198","254","255","016","023","024","027"],"Linha 2":["076","086","100","101","135","178","179","180","128","129","134"],"Linha 3":["542","541","560","585","756","757","706","705","558","590","591"],"Linha 4":["555","532","531","535","708","707"],"Linha 5":["196","609","259","260","074","068","097","444","402"],"LSR":["253","252","185"]};
const FORM="https://docs.google.com/forms/d/e/1FAIpQLSeYWRS5Ko14PHWUqVu6eMioVC16M5WsUJ8x5-szCYg8nbzu5Q/viewform";
const MODEL={name_prefixes:["B1"],task:"b1",dpi:203,density:3,label_type:1,speed:1};
const SIZE={w_px:384,h_px:240,offset_y_px:4};
let conectado=false, etiquetaURL="";
function atualizarMaquinas(){const l=linha.value,s=maquina;s.innerHTML="";if(!l){s.disabled=true;s.innerHTML='<option value="">Primeiro selecione a linha</option>';return}s.disabled=false;s.innerHTML='<option value="">Selecione a máquina</option>';MAQUINAS[l].forEach(m=>s.add(new Option(m,m)))}
function setStatus(t){document.getElementById('status').textContent=t}
async function conectarB1(){try{if(!window.Niimbot||!Niimbot.isSupported())throw new Error('Web Bluetooth não disponível. Abra pelo Chrome em uma página HTTPS.');setStatus('Procurando B1...');const p=await Niimbot.identify(MODEL);if(!p||p.modelId!==4096)throw new Error('A impressora encontrada não foi identificada como B1 (id 4096).');conectado=true;setStatus('✓ B1 conectada — id '+p.modelId+' • protocolo '+(p.protocolVersion??'detectado'));}catch(e){conectado=false;setStatus('Erro: '+e.message)}}
function gerar(e){e.preventDefault();const it=item.value.trim(),o=op.value.trim(),m=maquina.value.trim(),s=setor.value.trim();const p=new URLSearchParams({usp:'pp_url','entry.510346288':it,'entry.982950365':o,'entry.1488788372':m,'entry.705084022':s});const url=FORM+'?'+p.toString();if(!confirm('CONFIRMAR DADOS\n\nOP: '+o+'\nItem: '+it+'\nMáquina: '+m+'\nSetor: '+s))return;desenharEtiqueta(url,o,it,m);linktxt.textContent=url;resultado.style.display='block';resultado.scrollIntoView({behavior:'smooth'});}
function desenharEtiqueta(url,o,it,m){
 const c=preview,x=c.getContext('2d');
 x.imageSmoothingEnabled=false;
 x.fillStyle='#fff';x.fillRect(0,0,384,240);
 // Área textual refinada: maior contraste e hierarquia, sem alterar o QR aprovado.
 x.fillStyle='#000';x.textBaseline='top';
 x.font='bold 17px Arial';x.fillText('LIBERAÇÃO',10,13);x.fillText('DE PRODUÇÃO',10,34);
 x.fillRect(10,60,158,2);
 x.font='bold 20px Arial';x.fillText('OP:',10,76);x.font='bold 21px Arial';x.fillText(o,48,75);
 x.font='bold 20px Arial';x.fillText('ITEM:',10,113);x.font='bold 21px Arial';x.fillText(it,70,112);
 x.font='bold 20px Arial';x.fillText('MÁQ.:',10,150);x.font='bold 21px Arial';x.fillText(m,70,149);
 
 // QR aprovado no teste físico: dimensões e quiet zone preservadas.
 const holder=document.createElement('div');holder.style.position='fixed';holder.style.left='-9999px';document.body.appendChild(holder);
 new QRCode(holder,{text:url,width:192,height:192,correctLevel:QRCode.CorrectLevel.L});
 setTimeout(()=>{const q=holder.querySelector('canvas')||holder.querySelector('img');const draw=()=>{
   x.fillStyle='#fff';x.fillRect(180,16,200,208);
   x.drawImage(q,184,24,192,192);
   etiquetaURL=c.toDataURL('image/png');holder.remove();
 };if(q.tagName==='IMG'&&!q.complete)q.onload=draw;else draw()},100)
}
async function imprimirB1(){try{if(!etiquetaURL)throw new Error('Gere a etiqueta primeiro.');btnPrint.disabled=true;setStatus('Enviando etiqueta para a B1...');if(!conectado){const p=await Niimbot.identify(MODEL);if(!p||p.modelId!==4096)throw new Error('B1 não identificada.');conectado=true}await Niimbot.printImage(etiquetaURL,{model:MODEL,size:SIZE,copies:1,density:3,onProgress:s=>setStatus('B1: '+s)});setStatus('✓ Etiqueta impressa na B1.');}catch(e){conectado=false;setStatus('Erro ao imprimir: '+e.message)}finally{btnPrint.disabled=false}}
function novoQR(){item.value='';op.value='';linha.value='';maquina.innerHTML='<option value="">Primeiro selecione a linha</option>';maquina.disabled=true;setor.value='';resultado.style.display='none';etiquetaURL='';item.focus();window.scrollTo({top:0,behavior:'smooth'})}
</script></body></html>
